<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Sendspin Cinema TV</title>
    <style>
        body { background: #000; color: #444; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-size: 2.5rem; letter-spacing: 4px; cursor: none; }
    </style>
</head>
<body>
    Sendspin Cinema
    <script>
        // Launcher: when running as a TizenBrew module, always start the newest commit of the repository
        // (jsDelivr caches the plain branch URL for up to 12 hours, a commit hash is always fresh).
        // On any problem (pinned module, offline, GitHub rate limit, standalone .wgt) fall back to the bundled player.
        (function () {
            var player = 'player.html' + location.search;
            var done = false;
            function go(url) {
                if (done) return;
                done = true;
                location.replace(url);
            }

            var path = location.pathname.match(/^\/module\/([^/]+)\//);
            var repo = path && decodeURIComponent(path[1]).match(/^gh\/([^/@]+)\/([^/@]+)(@latest)?$/);
            if (!repo) return go(player);

            setTimeout(function () { go(player); }, 4000);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.github.com/repos/' + repo[1] + '/' + repo[2] + '/commits/HEAD');
            xhr.onload = function () {
                try {
                    var sha = JSON.parse(xhr.responseText).sha;
                    if (!/^[0-9a-f]{40}$/.test(sha)) return go(player);
                    var moduleName = 'gh/' + repo[1] + '/' + repo[2] + '@' + sha;
                    go('/module/' + encodeURIComponent(moduleName) + '/' + player);
                } catch (e) {
                    go(player);
                }
            };
            xhr.onerror = function () { go(player); };
            xhr.send();
        })();
    </script>
</body>
</html>
